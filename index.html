<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyurParam - AI Prakriti Checker</title>
<style>
body{font-family:Arial,sans-serif;background:#fdf6ec;margin:0;padding:20px}
.card{max-width:650px;margin:auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,0.1)}
h1{text-align:center;color:#2d5016}
p.sub{text-align:center;font-weight:bold}
label{font-weight:bold;display:block;margin-top:18px}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{width:100%;padding:14px;margin-top:25px;background:#2d5016;color:#fff;border:none;border-radius:10px;font-size:17px;cursor:pointer}
#result{margin-top:25px;background:#f0f7e6;padding:20px;border-radius:12px;display:none}
h2{color:#2d5016}
</style>
</head>
<body>
<div class="card">
<h1>🌿 AyurParam</h1>
<p class="sub">AI Prakriti Checker | Ayush Tech Innovate - Techfest IIT Bombay</p>

<label>Your Name:</label>
<input type="text" id="name" placeholder="Enter your name">

<label>1. What is your body type?</label>
<select id="q1">
<option value="vata">Thin, light</option>
<option value="pitta">Medium, muscular</option>
<option value="kapha">Heavy, strong</option>
</select>

<label>2. How is your appetite?</label>
<select id="q2">
<option value="vata">Sometimes more, sometimes less</option>
<option value="pitta">Strong, always hungry</option>
<option value="kapha">Slow, less hunger</option>
</select>

<label>3. How is your sleep?</label>
<select id="q3">
<option value="vata">Less, disturbed</option>
<option value="pitta">Medium, sound</option>
<option value="kapha">Deep, long</option>
</select>

<label>4. How do you react under stress?</label>
<select id="q4">
<option value="vata">Quick worry, fear</option>
<option value="pitta">Anger, irritation</option>
<option value="kapha">Calm, lazy</option>
</select>

<label>5. How is your skin?</label>
<select id="q5">
<option value="vata">Dry, cold</option>
<option value="pitta">Warm, reddish, oily</option>
<option value="kapha">Soft, oily, cool</option>
</select>

<label>6. Which weather do you like?</label>
<select id="q6">
<option value="vata">Warm weather</option>
<option value="pitta">Cool weather</option>
<option value="kapha">Warm, dry weather</option>
</select>

<button onclick="check()">View My Result</button>

<div id="result"></div>
</div>

<script>
function check(){
let name=document.getElementById('name').value || 'Friend';
let scores={vata:0,pitta:0,kapha:0};
for(let i=1;i<=6;i++){ scores[document.getElementById('q'+i).value]++; }
let dosha = Object.keys(scores).reduce((a,b)=> scores[a]>scores[b]?a:b);
let data={
vata:{title:"VATA DOSHA",diet:"Warm, oily food, Ghee, Milk, Cooked vegetables. Avoid cold and dry food.",herbs:"Ashwagandha, Shatavari, Brahmi",routine:"Early sleep, Oil massage, Warm water, Yoga"},
pitta:{title:"PITTA DOSHA",diet:"Cool food, Coconut water, Cucumber, Sweet fruits. Avoid spicy and oily food.",herbs:"Amla, Giloy, Brahmi",routine:"Cool bath, Meditation, Avoid afternoon sun"},
kapha:{title:"KAPHA DOSHA",diet:"Light, spicy food, Honey, Green vegetables. Avoid sweets and oily food.",herbs:"Triphala, Trikatu, Giloy",routine:"Early morning walk, Exercise, Dry brushing"}
};
let d=data[dosha];
document.getElementById('result').style.display='block';
document.getElementById('result').innerHTML=`<h2>Hello ${name}, Your Result: ${d.title}</h2><p><b>Recommended Diet:</b> ${d.diet}</p><p><b>Recommended Herbs:</b> ${d.herbs}</p><p><b>Daily Routine:</b> ${d.routine}</p>`;
window.scrollTo(0,document.body.scrollHeight);
}
</script>
</body>
</html>
